[project]
name = "soarm101-console"
version = "0.1.0"
description = "Local-first SO-ARM101 hardware status and teleoperation console"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "lerobot[dataset,feetech]==0.6.1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
