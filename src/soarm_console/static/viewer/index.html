<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover`와 `interactive-widget`이 함께 있어야 아이폰에서 키보드가
       올라올 때 화면이 밀려 올라가지 않는다. 조작 화면은 스크롤이 없으므로, 밀려 올라간
       만큼이 그대로 잘려 나간다. -->
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
  <meta name="theme-color" content="#070b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SO-ARM">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SO-ARM101 가상 리더</title>
  <link rel="manifest" href="/viewer/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/viewer/icon-180.png">
  <link rel="icon" href="/viewer/icon-180.png">
  <link rel="stylesheet" href="/static/viewer/viewer.css">
  <!-- three.js의 예제 모듈(OrbitControls·STLLoader)이 `three`를 그대로 import한다.
       CDN을 쓰지 않고 서버가 직접 서빙하므로, 그 이름이 어디를 가리키는지 여기서 정한다. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/static/viewer/vendor/three.module.min.js",
      "three/": "/static/viewer/vendor/"
    }
  }
  </script>
</head>
<!-- 클래스가 화면의 상태를 전부 들고 있다. `tab-*`는 지금 보고 있는 칸, `mode-*`는
     조작 방식, `host-*`는 이 페이지를 누가 품고 있는지. CSS가 그것만 보고 배치를
     정하므로, 자바스크립트가 요소의 크기를 계산해 넣는 자리가 없다 — 그런 계산은
     폰의 주소창이 접혔다 펴질 때마다 어긋난다. -->
<body class="loading tab-drive mode-joint">

  <!-- ─────────────────────────────── 머리. 언제나 보인다. -->
  <header id="top">
    <div class="brand">
      <span class="mark">S</span>
      <div class="lines">
        <strong id="state-line">연결 확인 중</strong>
        <small id="sub-line">SO-ARM 101</small>
      </div>
    </div>
    <button id="hold" class="stop" type="button" aria-label="긴급 정지">정지</button>
  </header>

  <!-- 멈춘 이유. **3D 위가 아니라 자기 줄에 있다.**
       처음에는 3D 위에 띄웠는데, 폰에서 3D가 세로로 눌리면 배너가 팔을 통째로 가렸다 —
       "무엇이 멈췄는지"를 읽는 동안 "무엇이 멈춰 있는지"를 볼 수 없었다. 겹치지 않는
       자리를 주면 둘 다 보인다. 아무 일도 없으면 이 줄은 높이 0이다. -->
  <div id="banner" class="banner" hidden>
    <strong id="banner-title">멈췄습니다</strong>
    <span id="banner-detail"></span>
    <button id="banner-resume" type="button" hidden>확인하고 계속</button>
  </div>

  <!-- ─────────────────────────────── 무대. 탭에 따라 안이 바뀐다. -->
  <main id="stage">
    <!-- 카메라. `조작`에서는 위쪽 띠, `카메라`에서는 무대 전체를 쓴다. 어느 쪽이든
         조작 중에 사라지지 않는다 — 팔이 실제로 무엇을 하고 있는지 보는 유일한 창이다. -->
    <section id="camera-pane">
      <img id="camera-image" alt="" draggable="false">
      <div id="camera-down" class="pane-note" hidden>카메라 영상이 오지 않습니다</div>
      <div class="camera-chips" role="tablist" aria-label="카메라 선택">
        <button class="chip on" type="button" data-camera="scene">작업공간</button>
        <button class="chip" type="button" data-camera="wrist">손목</button>
      </div>
    </section>

    <!-- 3D. `조작`에서만 보인다. -->
    <section id="view-pane">
      <canvas id="canvas"></canvas>

      <div id="boot" class="overlay">
        <div class="spinner"></div>
        <strong>3D 모델을 여는 중</strong>
        <small id="boot-detail">URDF와 메시를 받고 있습니다</small>
      </div>

      <!-- 시점. `끝점` 모드에서는 화면이 고정되므로 여기서만 돌린다. -->
      <div id="view-controls">
        <button id="turn-left" type="button" aria-label="시점 왼쪽으로 90도">⟲</button>
        <button id="view-name" type="button">앞</button>
        <button id="turn-right" type="button" aria-label="시점 오른쪽으로 90도">⟳</button>
      </div>

      <div id="grabbed" class="grabbed" hidden></div>
      <!-- 끝점 모드에서 무엇을 하면 되는지. 조작판이 아니라 3D의 구석에 둔다 — 조작판에
           두면 그만큼 3D가 줄고, 정작 그 설명이 가리키는 것이 3D다. -->
      <div id="endpoint-hint" class="grabbed hint-pill">3D를 끌면 <b>집게 끝</b>이 갑니다</div>
    </section>

    <!-- 상태. `상태` 탭에서만 무대를 쓴다. -->
    <section id="status-pane">
      <div id="joint-readings"></div>
      <div id="policy-line" class="policy-line"></div>
    </section>
  </main>

  <!-- ─────────────────────────────── 조작판. `조작` 탭에서만 보인다. -->
  <section id="panel">
    <div class="panel-head">
      <div class="mode-switch" role="tablist" aria-label="조작 방식">
        <button class="seg on" type="button" data-mode="joint">관절</button>
        <button class="seg" type="button" data-mode="endpoint">끝점</button>
      </div>
      <!-- 조작판을 접으면 3D가 화면을 다 쓴다. 끌어서 조작하는 사람에게는 슬라이더가
           늘 보일 이유가 없고, 폰에서는 그 자리가 곧 3D의 크기다. -->
      <button id="fold" type="button" aria-label="조작판 접기">▾</button>
    </div>

    <!-- 관절 모드: 관절마다 하나씩. -->
    <div id="joint-controls"></div>

    <!-- 끝점 모드: 3D를 끌어 끝을 옮기고, 나머지는 여기서. -->
    <div id="endpoint-controls">
      <div class="pad-row">
        <label for="depth">앞뒤</label>
        <input id="depth" type="range" min="-1" max="1" step="0.01" value="0">
        <output id="depth-out">0</output>
      </div>
      <div id="wrist-controls"></div>
      <div id="reach-note" class="reach-note" hidden>이 자리에는 닿지 않습니다</div>
    </div>
  </section>

  <!-- ─────────────────────────────── 권한. 필요할 때만 올라온다. -->
  <div id="sheet-scrim" hidden></div>
  <section id="sheet" hidden aria-modal="true" role="dialog">
    <header>
      <strong id="sheet-title">조작 권한</strong>
      <button id="sheet-close" type="button" aria-label="닫기">닫기</button>
    </header>
    <div id="lease-idle">
      <p class="hint">조작하려면 권한을 받아야 합니다. 받기 전까지는 보기만 합니다.</p>
      <label class="field">조작 토큰
        <input id="token" type="password" autocomplete="off" placeholder="서버의 SOARM_MOTION_TOKEN">
      </label>
      <label class="ack">
        <input id="confirm" type="checkbox">
        <span>현장에 사람·장애물·케이블이 없고, 전원 차단 위치를 알고 있습니다</span>
      </label>
      <button id="take" type="button" class="primary" disabled>조작 권한 받기</button>
    </div>
    <div id="lease-held" hidden>
      <p class="hint"><strong id="lease-holder">이 기기</strong>가 조작 중입니다. 화면에서 손을 떼면 팔은 그 자리에 섭니다.</p>
      <button id="give-back" type="button" class="primary">권한 반납</button>
      <button id="release-torque" type="button" class="ghost">토크 해제…</button>
    </div>
    <div id="feel">
      <strong class="feel-title">조작감</strong>
      <div id="feel-choices" class="feel-choices"></div>
      <p id="feel-detail" class="hint"></p>
    </div>
  </section>

  <!-- ─────────────────────────────── 아래 탭. 엄지가 닿는 자리. -->
  <nav id="tabs" role="tablist">
    <button class="tab on" type="button" data-tab="drive"><span>✥</span>조작</button>
    <button class="tab" type="button" data-tab="camera"><span>▣</span>카메라</button>
    <button class="tab" type="button" data-tab="status"><span>◷</span>상태</button>
    <button class="tab" type="button" data-tab="lease"><span>⚿</span>권한</button>
  </nav>

  <dialog id="torque-dialog">
    <form method="dialog">
      <h2>토크를 풀면 팔이 주저앉을 수 있습니다</h2>
      <p>접힌 자세라면 그대로 서 있지만, 힘으로 버티고 있던 자세라면 그 차이만큼 내려앉습니다. 팔을 받칠 수 있을 때만 하세요.</p>
      <label class="ack">
        <input id="release-confirm" type="checkbox">
        <span>팔이 내려앉아도 괜찮은 상태입니다</span>
      </label>
      <menu>
        <button value="cancel" type="submit">취소</button>
        <button id="release-go" value="release" type="submit" class="stop" disabled>토크 해제</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="/static/viewer/viewer.js"></script>
</body>
</html>
